    .panel { background:#824a32; color:#eca53c; padding:45px; border-radius:24px; text-align:center; box-shadow:0 15px 45px rgba(0,0,0,0.15); max-width: 90%; }
    button { padding:14px 30px; font-size:18px; font-weight:800; cursor:pointer; background:#FF6B6B; color:white; border:none; border-radius:12px; transition:0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,107,107,0.4); }
    
    /* КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Точное соответствие CSS-модели редактора для предотвращения смещения кнопок */
    #game-container { width: 100%; height: 100%; max-width: 1000px; max-height: 700px; background: white; position: relative; margin: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); border-radius: 24px; border: 8px solid white; overflow: hidden; }
    .game-layout { display:flex; width:100%; height:100%; padding:35px; background:#ecf0f1; box-sizing:border-box; position:relative; align-items:center; justify-content:center; overflow:hidden; }
    .puzzle-board { flex:1; width:100%; height:100%; position:relative; background:#ecf0f1; border:2px solid #bdc3c7; }
    
    .grid-cell { position:absolute; border:2px dashed rgba(0,0,0,0.1); box-sizing:border-box; }
    .puzzle-piece { position:absolute; box-sizing:border-box; cursor:grab; background-repeat:no-repeat; box-shadow:3px 3px 15px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:26px; text-shadow:2px 2px 0px rgba(0,0,0,0.5); user-select:none; z-index:10; border:3px solid rgba(255,255,255,0.8); border-radius:10px; transition:transform 0.15s ease-out; }
    .puzzle-piece:active { cursor:grabbing; z-index:50; transform:scale(1.05); transition:none; }
    .puzzle-piece.solved { box-shadow:none; border:none; cursor:default; z-index:5; color:transparent; text-shadow:none; border-radius:0; }
    
    .drag-ui-el { position:absolute; z-index:60; font-weight:900; }
    .drag-ui-el input[type=range] { cursor: pointer; accent-color: var(--primary); flex: 1; min-width: 50px; }
    
    .secret-word-card { position:absolute; color:#2F3542; font-weight:900; box-shadow:0 10px 25px rgba(0,0,0,0.25); z-index:70; display:none; text-align:center; border:4px solid #fff; text-transform: uppercase; transform: translate(-50%, -50%); transition: opacity 0.2s; }
    .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%,90%{transform:translate(-50%,-50%) translateX(-4px);} 20%,80%{transform:translate(-50%,-50%) translateX(5px);} 30%,50%,70%{transform:translate(-50%,-50%) translateX(-8px);} 40%,60%{transform:translate(-50%,-50%) translateX(8px);} }
    
    #task-popup { border: 5px solid #4ECDC4; }
    .task-option-btn { padding:14px; font-weight:700; background:#f8fafc; border:2px solid #cbd5e1; border-radius:12px; cursor:pointer; width:100%; text-align:left; transition:0.2s; }
    .task-option-btn:hover { border-color:#4ECDC4; background:#f0fdfa; transform:scale(1.02); }
    .task-checkbox-label { display:flex; align-items:center; gap:10px; font-weight:700; padding:10px; background:#f8fafc; border-radius:10px; border:2px solid #cbd5e1; cursor:pointer; }
    .task-checkbox-label input { width:20px; height:20px; accent-color:#4ECDC4; }
    .task-order-btn { display:inline-block; margin:5px; padding:10px 15px; background:#FFE66D; border-radius:10px; font-weight:800; cursor:pointer; border:2px solid #FFA502; transition:0.2s; }
    .task-order-btn:hover { transform: translateY(-2px); }
    .task-pair-btn { padding:12px; background:#f8fafc; border:2px solid #cbd5e1; border-radius:10px; cursor:pointer; font-weight:700; flex:1; text-align:center; transition:0.2s;}
    .task-pair-btn.active { border-color:#FF6B6B; background:#ffefef; }
    .task-pair-btn.matched { border-color:#2ED573; background:#e8f8f5; color:#2ED573; pointer-events:none; }
</style>
</head>
<body>
    <div id="layer-play" class="layer">
        <div id="game-container">
            <div class="game-layout">
                <div id="board" class="puzzle-board"></div>
            </div>
        </div>
    </div>
    <div id="layer-start" class="layer">
        <div class="panel">
            <div id="t-start-logo"></div>
            <h1 id="t-start-title"></h1><p id="t-start-text"></p>
            <button onclick="startGame()" style="margin-top:20px; font-family:'Nunito'; background:var(--primary); color:white; border:none; padding:12px 30px; font-size:18px; font-weight:800; border-radius:12px; cursor:pointer;" id="start-btn">Начать</button>
        </div>
    </div>
    <div id="layer-final" class="layer">
        <div class="panel" style="position:relative; z-index:110;">
            <h1 id="t-final-title"></h1>
            <h2 id="t-slogan" style="color:var(--primary); margin: 15px 0; font-size:32px; font-weight:900;"></h2>
            <div id="t-reward" style="font-size: 60px; margin-bottom: 20px;"></div>
            <p id="t-score" style="font-size: 24px; font-weight: 900;"></p>
            <p id="t-correct" style="font-size: 18px; margin-bottom: 25px; color:inherit; opacity:0.8; font-weight:800;"></p>
            <!-- Оставляем пустое место для QR, Genially может блокировать внешние скрипты, поэтому генерируем img -->
            <div id="qr-code" style="margin: 0 auto; display:flex; justify-content:center;"></div>
        </div>
    </div>

            h += '<option value="" disabled selected>-- Выберите ответ --</option>';
            let shuffledOpts = opts.map((o,i)=>({o,i})).sort(()=>Math.random()-0.5);
            shuffledOpts.forEach(obj => { h += '<option value="'+obj.i+'">'+obj.o+'</option>'; });
            h += '</select><button onclick="checkAns(document.getElementById(\'sel_ans\').value === \''+corrArr[0]+'\')" style="margin-top:15px; background:#FF6B6B; color:white; padding:12px; border-radius:12px; border:none; font-weight:bold; font-size:16px; cursor:pointer;">'+t('ansBtn')+'</button>';
        } else if(task.type === '5') {
            activePair = null; matchedPairs = 0;
            let pairs = task.pairs || [{a:'A',b:'B'}];
            let lefts = pairs.map((p,i)=>({t:p.a, i:i, s:'l'})).sort(()=>Math.random()-0.5);
            let rights = pairs.map((p,i)=>({t:p.b, i:i, s:'r'})).sort(()=>Math.random()-0.5);
            h += '<div style="display:flex; gap:20px;">';
            h += '<div style="flex:1; display:flex; flex-direction:column; gap:10px;">' + lefts.map((o,j) => '<div id="pl_'+o.i+'" class="task-pair-btn" style="'+styAns+'" onclick="clickPair(this, '+o.i+', \'l\')">'+o.t+'</div>').join('') + '</div>';
            h += '<div style="flex:1; display:flex; flex-direction:column; gap:10px;">' + rights.map((o,j) => '<div id="pr_'+o.i+'" class="task-pair-btn" style="'+styAns+'" onclick="clickPair(this, '+o.i+', \'r\')">'+o.t+'</div>').join('') + '</div>';
            h += '</div>';
        }

        h += '</div>'; pop.innerHTML = h; document.getElementById('game-container').appendChild(pop);
    }

    window.handleOddClick = function(btn, isCorr) {
        document.querySelectorAll('.type6-btn').forEach(b => b.style.pointerEvents = 'none');
        if(isCorr) {
            btn.style.backgroundColor = '#2ED573'; btn.style.color = 'white'; btn.style.borderColor = '#2ED573';
            setTimeout(() => checkAns(true), 800);
        } else {
            btn.style.backgroundColor = '#FF4757'; btn.style.color = 'white'; btn.style.borderColor = '#FF4757';
            setTimeout(() => {
                checkAns(false);
                document.querySelectorAll('.type6-btn').forEach(b => {
                    b.style.pointerEvents = 'auto'; b.style.backgroundColor = '#f8fafc'; b.style.color = state.styles.ans.color; b.style.borderColor = '#cbd5e1';
                });
            }, 800);
        }
    };

    window.checkMultiAns = function() {
        const task = state.tasks[activeP % state.tasks.length];
        const corrArr = Array.isArray(task.correct) ? task.correct : [task.correct||'0'];
        let isCorrect = true; let checkedCount = 0;
        task.options.forEach((o,i)=>{
            let isChecked = document.getElementById('chk_'+i).checked;
            if(isChecked) checkedCount++;
            if(isChecked !== corrArr.includes(i.toString())) isCorrect = false;
        });
        if(corrArr.length === 0 && checkedCount === 0) isCorrect = true;
        else if(corrArr.length > 0 && checkedCount === 0) isCorrect = false;
        checkAns(isCorrect);
    };

    window.clickOrderWord = function(el, idx) {
        document.getElementById('order-box').appendChild(el);
        el.onclick = null;
        orderSequence.push(idx.toString());
        const task = state.tasks[activeP % state.tasks.length];
        if(orderSequence.length === task.options.length) {
            let correct = true;
            for(let i=0; i<task.options.length; i++) if(orderSequence[i] !== i.toString()) correct = false;
            
            if(correct) {
                setTimeout(()=>checkAns(true), 300);
            } else {
                playSoundEffect(false); 
                attempts++;
                const p = document.getElementById('t-pop');
                if(p) { p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }
                
                setTimeout(() => {
                    const box = document.getElementById('order-box');
                    const bank = document.getElementById('word-bank');
                    if(box && bank) {
                        box.innerHTML = ''; bank.innerHTML = '';
                        orderSequence = [];
                        let shuffled = task.options.map((v,i)=>({v,i})).sort(()=>Math.random()-0.5);
                        const styAns = 'font-family:'+state.styles.ans.font+'; font-size:'+state.styles.ans.size+'px; color:'+state.styles.ans.color+';';
                        shuffled.forEach(obj => { 
                            bank.innerHTML += '<div class="task-order-btn" style="'+styAns+'" onclick="clickOrderWord(this, '+obj.i+')">'+obj.v+'</div>'; 
                        });
                    }
                }, 800);
            }
        }
    };

    window.clickPair = function(el, idx, side) {
        if(activePair) {
            if(activePair.side === side) { 
                document.getElementById('p'+activePair.side+'_'+activePair.idx).style.borderColor = '#cbd5e1';
                el.style.borderColor = '#FF6B6B'; activePair = {idx, side};
            } else { 
                const el1 = document.getElementById('p'+activePair.side+'_'+activePair.idx);
                if(activePair.idx === idx) {
                    el1.style.borderColor = '#2ED573'; el1.style.background = '#e8f8f5'; el1.style.pointerEvents = 'none';
                    el.style.borderColor = '#2ED573'; el.style.background = '#e8f8f5'; el.style.pointerEvents = 'none';
                    matchedPairs++; activePair = null; playSoundEffect(true);
                    const task = state.tasks[activeP % state.tasks.length];
                    if(matchedPairs === task.pairs.length) setTimeout(()=>checkAns(true), 400);
                } else {
                    el1.style.borderColor = '#cbd5e1'; activePair = null; checkAns(false);
                }
            }
        } else {
            el.style.borderColor = '#FF6B6B'; activePair = {idx, side};
        }
    };

    function checkAns(corr) {
        playSoundEffect(corr);
        if(corr) {
            if(activeP === targetD) { 
                score += (attempts===0?state.scoreConfig.first:state.scoreConfig.next); 
                if(attempts===0) correctCount++;
                const oldStartIdxOfA = shuffledOrder[activeP]; const indexOfB = shuffledOrder.findIndex(val => val === activeP);
                if (indexOfB !== -1) {
                    shuffledOrder[indexOfB] = oldStartIdxOfA; shuffledOrder[activeP] = activeP;
                    const pB = document.querySelector('.puzzle-piece[data-index="'+indexOfB+'"]');
                    if (pB && !pB.classList.contains('solved')) {
                        const board = document.getElementById('board'); const count = parseInt(state.pieces);
                        let cols=2,rows=2; if(count===6){cols=3;rows=2;} if(count===9){cols=3;rows=3;} if(count===12){cols=4;rows=3;}
                        if(count===16){cols=4;rows=4;} if(count===20){cols=5;rows=4;} if(count===24){cols=6;rows=4;} if(count===25){cols=5;rows=5;} if(count===30){cols=6;rows=5;}
                        const cw = board.offsetWidth/cols, ch = board.offsetHeight/rows;
                        const sc = oldStartIdxOfA % cols, sr = Math.floor(oldStartIdxOfA / cols); const sx = sc * cw, sy = sr * ch;
                        pB.dataset.startX = sx; pB.dataset.startY = sy; pB.style.left = sx + 'px'; pB.style.top = sy + 'px';
                    }
                }
                solved.push(activeP); lockP(activeP); 
            } else { 
                score -= state.scoreConfig.penalty; 
                const p = document.querySelector('.puzzle-piece[data-index="'+activeP+'"]'); 
                p.style.left = p.dataset.startX + 'px'; p.style.top = p.dataset.startY + 'px'; 
            }
            document.getElementById('ui-score').innerText = '⭐ ' + t('pts') + ': '+score;
            const tPop = document.getElementById('t-pop'); if(tPop) tPop.remove(); 
            activeP=null;
            checkSec();
            if(solved.length >= parseInt(state.pieces)) {
                clearInterval(timerInterval); setTimeout(finishGame, 500);
            }
        } else {
            attempts++; const p=document.getElementById('t-pop'); if(p) { p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }
            document.querySelectorAll('.task-pair-btn').forEach(b => { if(b.style.borderColor !== 'rgb(46, 213, 115)') b.style.borderColor = '#cbd5e1'; });
            activePair = null;
        }
    }

    function lockP(idx) {
        const p = document.querySelector('.puzzle-piece[data-index="'+idx+'"]');
        const c = document.querySelector('.grid-cell[data-index="'+idx+'"]');
        if(p && c) { p.classList.add('solved'); p.style.left=c.style.left; p.style.top=c.style.top; }
    }

    function finishGame() {
        document.getElementById('layer-final').style.display='flex';
        document.getElementById('t-slogan').innerText = state.slogan;
        document.getElementById('t-reward').innerText = state.reward;
        document.getElementById('t-score').innerText = '⭐ ' + t('pts') + ': ' + score;
        document.getElementById('t-correct').innerText = '🎯 ' + t('corr') + ' ' + correctCount + ' / ' + state.pieces;
        
        const qrData = encodeURIComponent("Очки: " + score + " | Верных: " + correctCount + "/" + state.pieces + " | Дата: " + new Date().toLocaleDateString());
        document.getElementById("qr-code").innerHTML = '<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=' + qrData + '" alt="QR" style="border-radius:12px;">';
    }

    function checkSec() {
        const b = document.getElementById('board'); if(!b) return;
        const count = parseInt(state.pieces); let cols=2, rows=2; if(count===6){cols=3;rows=2;} if(count===9){cols=3;rows=3;} if(count===12){cols=4;rows=3;}
        if(count===16){cols=4;rows=4;} if(count===20){cols=5;rows=4;} if(count===24){cols=6;rows=4;} if(count===25){cols=5;rows=5;} if(count===30){cols=6;rows=5;}
        
        state.secretAreas.forEach((area, idx) => {
            if(area.polygon.length < 3 || !area.word) return;
            let all=true, req=0;
            for(let i=0;i<count;i++){
                const cw_pct = 100 / cols;
                const ch_pct = 100 / rows;
                const cx = ((i % cols) * cw_pct) + (cw_pct / 2);
                const cy = (Math.floor(i / cols) * ch_pct) + (ch_pct / 2);
                
                const pts = [
                    {x: cx, y: cy},
                    {x: cx - cw_pct*0.4, y: cy - ch_pct*0.4}, {x: cx + cw_pct*0.4, y: cy - ch_pct*0.4},
                    {x: cx - cw_pct*0.4, y: cy + ch_pct*0.4}, {x: cx + cw_pct*0.4, y: cy + ch_pct*0.4}
                ];
                
                let ins = false;
                for (let pt of pts) {
                    let inside = false;
                    for(let k=0,j=area.polygon.length-1; k<area.polygon.length; j=k++){
                        let pk = area.polygon[k], pj = area.polygon[j];
                        if(((pk.y>pt.y)!=(pj.y>pt.y)) && (pt.x<(pj.x-pk.x)*(pt.y-pk.y)/(pj.y-pk.y)+pk.x)) inside=!inside;
                    }
                    if (inside) { ins = true; break; }
                }
                if(ins){ req++; if(!solved.includes(i)) all=false; }
            }
            const sec = document.getElementById('secret-'+idx);
            if(sec) {
                if(req>0 && all) {
                    if(sec.style.display !== 'block') {
                        sec.style.display = 'block';
                        sec.style.zIndex = '150';
                        sec.classList.remove('shake'); void sec.offsetWidth; sec.classList.add('shake');
                    }
                } else { sec.style.display = 'none'; }
            }
        });
    }

    window.onload = init;
</script></body></html>
